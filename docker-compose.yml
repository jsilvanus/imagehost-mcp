services:
  postgres:
    image: postgres:17-alpine
    container_name: imagehost-postgres
    environment:
      POSTGRES_DB: imagehost
      POSTGRES_USER: imagehost_user
      POSTGRES_PASSWORD: imagehost_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagehost_user -d imagehost"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: minio/minio:latest
    container_name: imagehost-s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  s3-data:
