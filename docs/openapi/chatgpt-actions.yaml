openapi: 3.1.0
info:
  title: ImageHost ChatGPT Actions API
  description: >
    Custom GPT Actions integration for ImageHost. Allows ChatGPT to automatically import
    generated images into the user's permanent ImageHost storage via OpenAI's openaiFileIdRefs mechanism.
  version: 1.0.0
servers:
  - url: https://kehitys.riihimaenseurakunta.fi/kuvarasto
    description: Production ImageHost Server
paths:
  /api/chatgpt/import:
    post:
      operationId: importChatGptImages
      summary: Import generated images into ImageHost
      description: >
        Receives OpenAI generated image file references, securely downloads them,
        processes and generates WebP derivatives, stores them in S3, and returns permanent URLs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - openaiFileIdRefs
              properties:
                openaiFileIdRefs:
                  type: array
                  description: File references generated by ChatGPT containing download links.
                  items:
                    type: object
                    required:
                      - download_link
                    properties:
                      id:
                        type: string
                        description: OpenAI file ID
                        example: file-abc123xyz
                      name:
                        type: string
                        description: Suggested or original filename
                        example: sunset_landscape.png
                      mime_type:
                        type: string
                        description: MIME type of the file
                        example: image/png
                      download_link:
                        type: string
                        format: uri
                        description: Short-lived HTTPS download URL provided by OpenAI
                        example: https://files.oaiusercontent.com/file-abc123xyz
                groupName:
                  type: string
                  description: Name of the photo group or album to store images in. Defaults to 'ChatGPT'.
                  example: ChatGPT
                groupId:
                  type: string
                  description: Optional ID of an existing photo group.
                description:
                  type: string
                  description: Optional prompt or description associated with the image.
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to label the imported image.
                  example: ["chatgpt", "dall-e", "landscape"]
      responses:
        '200':
          description: Images imported successfully (or partial success).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: Invalid request body or missing file references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Failed to import any of the provided images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter the ImageHost Bearer token or API key configured in ImageHost.
  schemas:
    ImportResponse:
      type: object
      required:
        - success
        - images
      properties:
        success:
          type: boolean
          description: True if at least one image was successfully imported.
        images:
          type: array
          description: List of successfully imported images.
          items:
            $ref: '#/components/schemas/ImportedImage'
        errors:
          type: array
          description: List of errors encountered during download or processing.
          items:
            $ref: '#/components/schemas/ImportError'
    ImportedImage:
      type: object
      required:
        - image_id
        - filename
        - mime_type
        - url
        - status
      properties:
        image_id:
          type: string
          description: Permanent unique identifier in ImageHost.
        filename:
          type: string
          description: Saved filename.
        mime_type:
          type: string
          description: Detected MIME type.
        url:
          type: string
          format: uri
          description: Permanent ImageHost preview/download URL.
        sequence_number:
          type: integer
          description: Group sequence number.
        width:
          type: integer
          description: Image pixel width.
        height:
          type: integer
          description: Image pixel height.
        byte_size:
          type: integer
          description: Byte size of the stored original file.
        status:
          type: string
          enum: [success]
    ImportError:
      type: object
      required:
        - error
      properties:
        id:
          type: string
          description: Reference ID of the failed item.
        filename:
          type: string
          description: Filename of the failed item.
        error:
          type: string
          description: Human-readable error description.
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error explanation.
